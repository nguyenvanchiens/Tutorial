<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vocabulary — Từ Vựng Của Tôi</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --bg:#0B0F1A;--surface:#111827;--surface2:#1E293B;--border:#1E293B;
            --text:#E2E8F0;--text-dim:#94A3B8;--primary:#22D3EE;--accent:#A78BFA;
            --green:#10B981;--orange:#F59E0B;--red:#F43F5E;--blue:#3B82F6;
            --radius:12px;--radius-sm:8px;
        }
        html{scroll-behavior:smooth}
        body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;min-height:100vh}

        /* ═══ Navbar ═══ */
        .navbar{position:fixed;top:0;left:0;width:100%;background:rgba(11,15,26,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 32px;height:56px}
        .nav-logo{font-weight:800;font-size:1rem;color:var(--primary);text-decoration:none}
        .nav-links{display:flex;gap:20px}
        .nav-links a{color:var(--text-dim);text-decoration:none;font-size:.85rem;font-weight:500;transition:color .2s}
        .nav-links a:hover{color:var(--primary)}
        .nav-hamburger{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:4px}
        .nav-hamburger span{width:22px;height:2px;background:var(--text);border-radius:2px;transition:transform .3s,opacity .3s}

        /* ═══ Hero ═══ */
        .hero{padding:90px 24px 40px;text-align:center;background:linear-gradient(180deg,rgba(34,211,238,.06) 0%,transparent 60%)}
        .hero h1{font-size:2.2rem;font-weight:900;margin-bottom:8px}
        .gradient-text{background:linear-gradient(135deg,var(--primary),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .hero p{color:var(--text-dim);font-size:.95rem}
        .stats-row{display:flex;justify-content:center;gap:32px;margin-top:20px;flex-wrap:wrap}
        .stat{text-align:center}
        .stat-num{font-size:1.6rem;font-weight:900;color:var(--primary)}
        .stat-label{font-size:.7rem;color:var(--text-dim);text-transform:uppercase;letter-spacing:1px}

        /* ═══ Container ═══ */
        .container{max-width:900px;margin:0 auto;padding:0 24px}

        /* ═══ Toolbar ═══ */
        .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px;align-items:center}
        .search-box{flex:1;min-width:200px;padding:10px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s}
        .search-box:focus{border-color:var(--primary)}
        .search-box::placeholder{color:var(--text-dim)}
        .filter-select{padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--text);font-size:.85rem;font-family:inherit;cursor:pointer;outline:none}
        .filter-select:focus{border-color:var(--primary)}

        .btn{padding:10px 18px;border:none;border-radius:var(--radius-sm);font-size:.85rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
        .btn-primary{background:var(--primary);color:var(--bg)}
        .btn-primary:hover{background:#06B6D4}
        .btn-accent{background:var(--accent);color:#fff}
        .btn-accent:hover{background:#8B5CF6}
        .btn-green{background:var(--green);color:#fff}
        .btn-green:hover{background:#059669}
        .btn-orange{background:var(--orange);color:var(--bg)}
        .btn-orange:hover{background:#D97706}
        .btn-red{background:rgba(244,63,94,.15);color:var(--red);border:1px solid rgba(244,63,94,.3)}
        .btn-red:hover{background:rgba(244,63,94,.25)}
        .btn-ghost{background:transparent;color:var(--text-dim);border:1px solid var(--border)}
        .btn-ghost:hover{border-color:var(--primary);color:var(--text)}
        .btn-sm{padding:6px 12px;font-size:.78rem}

        .file-actions{display:flex;gap:8px;margin-left:auto}

        /* ═══ Add Form ═══ */
        .add-section{margin-bottom:32px}
        .add-toggle{width:100%;padding:14px 20px;background:var(--surface);border:1px dashed var(--border);border-radius:var(--radius);color:var(--primary);font-size:.95rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;text-align:left}
        .add-toggle:hover{border-color:var(--primary);background:rgba(34,211,238,.04)}
        .add-form{display:none;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px;margin-top:8px}
        .add-form.open{display:block}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
        .form-row.full{grid-template-columns:1fr}
        .form-group{display:flex;flex-direction:column;gap:4px}
        .form-group label{font-size:.78rem;font-weight:600;color:var(--text-dim);text-transform:uppercase;letter-spacing:.5px}
        .form-group input,.form-group textarea,.form-group select{padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface2);color:var(--text);font-size:.9rem;font-family:inherit;outline:none;transition:border-color .2s}
        .form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--primary)}
        .form-group textarea{resize:vertical;min-height:60px}
        .form-actions{display:flex;gap:8px;margin-top:16px}

        /* ═══ Word Cards ═══ */
        .word-list{display:flex;flex-direction:column;gap:10px;margin-bottom:40px}
        .word-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px 20px;transition:border-color .2s;position:relative}
        .word-card:hover{border-color:rgba(34,211,238,.3)}
        .word-card.editing{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
        .word-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:8px}
        .word-en{font-size:1.15rem;font-weight:800;color:var(--primary)}
        .word-vi{font-size:1rem;font-weight:600;color:var(--accent);margin-left:12px}
        .word-meta{display:flex;gap:8px;align-items:center;flex-shrink:0}
        .word-cat{padding:3px 10px;border-radius:12px;font-size:.7rem;font-weight:700;background:rgba(34,211,238,.1);color:var(--primary)}
        .cat-noun{background:rgba(59,130,246,.12);color:#60A5FA}
        .cat-verb{background:rgba(16,185,129,.12);color:#34D399}
        .cat-adj{background:rgba(245,158,11,.12);color:#FBBF24}
        .cat-adv{background:rgba(236,72,153,.12);color:#F472B6}
        .cat-phrase{background:rgba(139,92,246,.12);color:#A78BFA}
        .cat-tech{background:rgba(6,182,212,.12);color:#22D3EE}
        .cat-other{background:rgba(148,163,184,.12);color:#94A3B8}
        .word-example{font-size:.85rem;color:var(--text-dim);font-style:italic;margin-top:4px;padding-left:12px;border-left:2px solid var(--border)}
        .word-date{font-size:.7rem;color:var(--text-dim);margin-top:6px}
        .word-actions{display:flex;gap:6px}
        .word-actions button{background:none;border:none;cursor:pointer;padding:4px 8px;border-radius:4px;font-size:.78rem;transition:all .15s;font-family:inherit}
        .word-actions .btn-edit{color:var(--accent)}
        .word-actions .btn-edit:hover{background:rgba(167,139,250,.1)}
        .word-actions .btn-delete{color:var(--red)}
        .word-actions .btn-delete:hover{background:rgba(244,63,94,.1)}

        /* ═══ Edit inline ═══ */
        .edit-inline{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
        .edit-inline.open{display:block}

        /* ═══ Empty State ═══ */
        .empty-state{text-align:center;padding:60px 20px;color:var(--text-dim)}
        .empty-state .icon{font-size:3rem;margin-bottom:12px}
        .empty-state h3{color:var(--text);margin-bottom:8px}

        /* ═══ Toast ═══ */
        .toast{position:fixed;bottom:24px;right:24px;padding:12px 20px;border-radius:var(--radius-sm);font-size:.85rem;font-weight:600;color:#fff;z-index:200;transform:translateY(100px);opacity:0;transition:all .3s ease}
        .toast.show{transform:translateY(0);opacity:1}
        .toast-success{background:var(--green)}
        .toast-error{background:var(--red)}
        .toast-info{background:var(--blue)}

        /* ═══ Modal ═══ */
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:150;display:none;align-items:center;justify-content:center}
        .modal-overlay.open{display:flex}
        .modal{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:28px;max-width:420px;width:90%}
        .modal h3{margin-bottom:12px;font-size:1.1rem}
        .modal p{color:var(--text-dim);font-size:.9rem;margin-bottom:20px}
        .modal-actions{display:flex;gap:8px;justify-content:flex-end}

        /* ═══ Footer ═══ */
        .footer{padding:32px 24px;text-align:center;border-top:1px solid var(--border);margin-top:40px}
        .footer p{color:var(--text-dim);font-size:.82rem}
        .footer a{color:var(--primary);text-decoration:none}
        .footer a:hover{text-decoration:underline}

        /* ═══ Hidden file input ═══ */
        #file-input{display:none}

        /* ═══ Responsive ═══ */
        @media(max-width:768px){
            .nav-links{display:none}
            .nav-hamburger{display:flex}
            .hero h1{font-size:1.6rem}
            .toolbar{flex-direction:column}
            .file-actions{margin-left:0;width:100%;justify-content:stretch}
            .file-actions .btn{flex:1;justify-content:center}
            .form-row{grid-template-columns:1fr}
            .word-top{flex-direction:column}
            .word-meta{margin-top:4px}
        }
        @media(max-width:480px){
            .hero h1{font-size:1.3rem}
            .stats-row{gap:16px}
        }
    </style>
</head>
<body>

<!-- ═══ NAVBAR ═══ -->
<nav class="navbar">
    <a href="index.html" class="nav-logo">📋 TODO Hub</a>
    <div class="nav-links">
        <a href="../BE/index.html">.NET</a>
        <a href="../SQL/index.html">SQL</a>
        <a href="../BUILD/index.html">Build</a>
        <a href="../TUTORIAL WEB/index.html">Languages</a>
        <a href="../ENGLISH/index.html">English</a>
        <a href="index.html">Schedule</a>
        <a href="focus.html" style="color:var(--red)">Focus</a>
    </div>
    <button class="nav-hamburger" aria-label="Menu"><span></span><span></span><span></span></button>
</nav>

<!-- ═══ HERO ═══ -->
<header class="hero">
    <h1>My <span class="gradient-text">Vocabulary</span></h1>
    <p>Từ vựng của tôi — Thêm, sửa, xóa, lưu file, load file.</p>
    <div class="stats-row">
        <div class="stat"><span class="stat-num" id="stat-total">0</span><span class="stat-label">Tổng từ</span></div>
        <div class="stat"><span class="stat-num" id="stat-today">0</span><span class="stat-label">Hôm nay</span></div>
        <div class="stat"><span class="stat-num" id="stat-week">0</span><span class="stat-label">Tuần này</span></div>
    </div>
</header>

<!-- ═══ MAIN ═══ -->
<main class="container" style="padding-top:24px;padding-bottom:60px">

    <!-- Toolbar -->
    <div class="toolbar">
        <input type="text" class="search-box" id="search" placeholder="Tìm từ vựng...">
        <select class="filter-select" id="filter-cat">
            <option value="all">Tất cả loại</option>
            <option value="noun">Noun</option>
            <option value="verb">Verb</option>
            <option value="adj">Adjective</option>
            <option value="adv">Adverb</option>
            <option value="phrase">Phrase</option>
            <option value="tech">Tech</option>
            <option value="other">Other</option>
        </select>
        <div class="file-actions">
            <button class="btn btn-green btn-sm" id="btn-save" title="Lưu ra file trong folder TODO">💾 Save</button>
            <button class="btn btn-orange btn-sm" id="btn-load" title="Load file từ folder TODO">📂 Load</button>
        </div>
        <input type="file" id="file-input" accept=".txt,.json">
    </div>
    <div id="file-status" style="display:none;padding:8px 14px;border-radius:6px;font-size:.8rem;margin-bottom:16px;background:var(--surface);border:1px solid var(--border)"></div>

    <!-- Add New Word -->
    <div class="add-section">
        <button class="add-toggle" id="add-toggle">+ Thêm từ mới</button>
        <div class="add-form" id="add-form">
            <div class="form-row">
                <div class="form-group">
                    <label>Từ tiếng Anh * <small style="color:var(--primary);font-weight:400">(nhập xong Tab → tự tra IPA)</small></label>
                    <div style="display:flex;gap:8px">
                        <input type="text" id="inp-en" placeholder="e.g. compile" style="flex:1">
                        <button class="btn btn-accent btn-sm" id="btn-lookup" type="button" title="Tra từ điển">🔍 Tra</button>
                    </div>
                </div>
                <div class="form-group">
                    <label>Nghĩa tiếng Việt</label>
                    <input type="text" id="inp-vi" placeholder="Tự điền khi tra, hoặc nhập tay">
                </div>
            </div>
            <div id="lookup-status" style="display:none;padding:8px 14px;border-radius:6px;font-size:.82rem;margin-bottom:8px"></div>
            <div class="form-row">
                <div class="form-group">
                    <label>Loại từ</label>
                    <select id="inp-cat">
                        <option value="noun">Noun</option>
                        <option value="verb">Verb</option>
                        <option value="adj">Adjective</option>
                        <option value="adv">Adverb</option>
                        <option value="phrase">Phrase</option>
                        <option value="tech">Tech</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Phát âm (IPA) <small style="color:var(--green);font-weight:400">auto-fill</small></label>
                    <input type="text" id="inp-ipa" placeholder="Tự điền khi tra từ điển">
                </div>
            </div>
            <div class="form-row full">
                <div class="form-group">
                    <label>Ví dụ (EN)</label>
                    <input type="text" id="inp-example" placeholder="e.g. The compiler will compile the code.">
                </div>
            </div>
            <div class="form-row full">
                <div class="form-group">
                    <label>Ví dụ (VI) <small style="color:var(--green);font-weight:400">auto-fill</small></label>
                    <input type="text" id="inp-example-vi" placeholder="Tự dịch khi tra từ điển">
                </div>
            </div>
            <div class="form-actions">
                <button class="btn btn-primary" id="btn-add">Thêm từ</button>
                <button class="btn btn-ghost" id="btn-cancel">Hủy</button>
            </div>
        </div>
    </div>

    <!-- Word List -->
    <div id="word-list" class="word-list"></div>

</main>

<!-- ═══ DELETE MODAL ═══ -->
<div class="modal-overlay" id="modal-delete">
    <div class="modal">
        <h3>Xóa từ vựng?</h3>
        <p>Bạn có chắc muốn xóa từ "<strong id="modal-word"></strong>"? Không thể hoàn tác.</p>
        <div class="modal-actions">
            <button class="btn btn-ghost" id="modal-cancel">Hủy</button>
            <button class="btn btn-red" id="modal-confirm">Xóa</button>
        </div>
    </div>
</div>

<!-- ═══ TOAST ═══ -->
<div class="toast" id="toast"></div>

<!-- ═══ FOOTER ═══ -->
<footer class="footer">
    <p>My Vocabulary — <a href="index.html">Quay lại Lịch trình</a></p>
</footer>

<script>
(function(){
    'use strict';

    // ═══ STATE ═══
    let words = [];
    let editingId = null;
    let deleteId = null;

    // ═══ DOM ═══
    const $ = s => document.querySelector(s);
    const searchBox = $('#search');
    const filterCat = $('#filter-cat');
    const wordListEl = $('#word-list');
    const addToggle = $('#add-toggle');
    const addForm = $('#add-form');
    const btnAdd = $('#btn-add');
    const btnCancel = $('#btn-cancel');
    const btnSave = $('#btn-save');
    const btnLoad = $('#btn-load');
    const fileInput = $('#file-input');
    const modalDelete = $('#modal-delete');
    const modalWord = $('#modal-word');
    const modalCancel = $('#modal-cancel');
    const modalConfirm = $('#modal-confirm');
    const toastEl = $('#toast');

    const btnLookup = $('#btn-lookup');
    const lookupStatus = $('#lookup-status');

    // ═══ TOAST ═══
    function toast(msg, type = 'success') {
        toastEl.textContent = msg;
        toastEl.className = 'toast toast-' + type + ' show';
        setTimeout(() => toastEl.classList.remove('show'), 2500);
    }

    // ═══ DICTIONARY API ═══
    function showLookupStatus(msg, type) {
        lookupStatus.style.display = 'block';
        lookupStatus.textContent = msg;
        lookupStatus.style.background = type === 'ok' ? 'rgba(16,185,129,.1)' : type === 'loading' ? 'rgba(34,211,238,.1)' : 'rgba(244,63,94,.1)';
        lookupStatus.style.color = type === 'ok' ? 'var(--green)' : type === 'loading' ? 'var(--primary)' : 'var(--red)';
    }
    function hideLookupStatus() { lookupStatus.style.display = 'none'; }

    // Dịch EN → VI qua Google Translate (free, no key)
    async function translateToVi(text) {
        try {
            const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=vi&dt=t&q=' + encodeURIComponent(text);
            const res = await fetch(url);
            const data = await res.json();
            // data[0] là mảng các đoạn dịch, mỗi đoạn [0] là text đã dịch
            return data[0].map(s => s[0]).join('');
        } catch(e) { return ''; }
    }

    async function lookupWord() {
        const word = $('#inp-en').value.trim().toLowerCase();
        if (!word) { toast('Nhập từ tiếng Anh trước!', 'error'); return; }

        showLookupStatus('Đang tra "' + word + '"...', 'loading');
        btnLookup.disabled = true;
        btnLookup.textContent = '⏳';

        // Reset các ô auto-fill để tra từ mới không bị dính từ cũ
        $('#inp-vi').value = '';
        $('#inp-ipa').value = '';
        $('#inp-cat').value = 'other';
        $('#inp-example').value = '';
        $('#inp-example-vi').value = '';

        try {
            // Song song: gọi Dictionary API + Google Translate cùng lúc
            const [dictRes, viMeaning] = await Promise.all([
                fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(word)).then(r => r.ok ? r.json() : null).catch(() => null),
                translateToVi(word)
            ]);

            // Điền nghĩa tiếng Việt
            if (viMeaning && !$('#inp-vi').value) {
                $('#inp-vi').value = viMeaning;
            }

            if (dictRes && dictRes[0]) {
                const entry = dictRes[0];

                // IPA
                const phonetic = entry.phonetics.find(p => p.text) || {};
                if (phonetic.text) $('#inp-ipa').value = phonetic.text;

                // Part of speech + example từ nghĩa đầu tiên
                const meanings = entry.meanings || [];
                if (meanings.length > 0) {
                    const posMap = { noun:'noun', verb:'verb', adjective:'adj', adverb:'adv', exclamation:'phrase', interjection:'phrase', preposition:'other', conjunction:'other', pronoun:'noun', determiner:'other', abbreviation:'other' };
                    const mapped = posMap[meanings[0].partOfSpeech];
                    if (mapped) $('#inp-cat').value = mapped;

                    const def = meanings[0].definitions[0];
                    if (def && def.example) {
                        $('#inp-example').value = def.example;
                        const exVi = await translateToVi(def.example);
                        if (exVi) $('#inp-example-vi').value = exVi;
                    }
                }
            }

            const ipa = $('#inp-ipa').value || 'N/A';
            const vi = $('#inp-vi').value || '';
            showLookupStatus('Đã tra xong! IPA: ' + ipa + (vi ? ' — Nghĩa: ' + vi : ''), 'ok');
        } catch(e) {
            // Nếu Dictionary API lỗi, vẫn thử dịch
            const viMeaning = await translateToVi(word);
            if (viMeaning && !$('#inp-vi').value) $('#inp-vi').value = viMeaning;
            showLookupStatus(viMeaning ? 'Đã dịch nghĩa, nhưng không tìm thấy IPA.' : 'Không tìm thấy "' + word + '". Nhập tay nhé!', viMeaning ? 'ok' : 'err');
        } finally {
            btnLookup.disabled = false;
            btnLookup.textContent = '🔍 Tra';
        }
    }

    // ═══ STORAGE ═══
    let fileHandle = null; // giữ handle để Save ghi lại cùng file

    function saveToLocal() {
        localStorage.setItem('my-vocab', JSON.stringify(words));
    }

    function loadFromLocal() {
        try {
            const data = localStorage.getItem('my-vocab');
            if (data) words = JSON.parse(data);
        } catch(e) { words = []; }
    }

    function updateFileStatus() {
        const el = $('#file-status');
        if (fileHandle) {
            el.textContent = '📁 File: ' + fileHandle.name + ' — bấm Save để ghi lại';
            el.style.display = 'block';
            el.style.color = 'var(--green)';
        } else {
            el.textContent = '⚠️ Chưa chọn file — bấm Load để đọc hoặc Save để lưu mới';
            el.style.display = 'block';
            el.style.color = 'var(--orange)';
        }
    }

    // ═══ STATS ═══
    function updateStats() {
        const now = new Date();
        const todayStr = now.toISOString().slice(0, 10);
        const weekAgo = new Date(now); weekAgo.setDate(weekAgo.getDate() - 7);

        $('#stat-total').textContent = words.length;
        $('#stat-today').textContent = words.filter(w => w.date && w.date.slice(0, 10) === todayStr).length;
        $('#stat-week').textContent = words.filter(w => w.date && new Date(w.date) >= weekAgo).length;
    }

    // ═══ RENDER ═══
    function catClass(cat) {
        const map = { noun:'cat-noun', verb:'cat-verb', adj:'cat-adj', adv:'cat-adv', phrase:'cat-phrase', tech:'cat-tech', other:'cat-other' };
        return map[cat] || 'cat-other';
    }
    function catLabel(cat) {
        const map = { noun:'Noun', verb:'Verb', adj:'Adj', adv:'Adv', phrase:'Phrase', tech:'Tech', other:'Other' };
        return map[cat] || cat;
    }
    function escHtml(s) {
        const d = document.createElement('div'); d.textContent = s; return d.innerHTML;
    }

    function renderWord(w) {
        const isEditing = editingId === w.id;
        return `
        <div class="word-card ${isEditing ? 'editing' : ''}" data-id="${w.id}">
            <div class="word-top">
                <div>
                    <span class="word-en">${escHtml(w.en)}</span>
                    ${w.ipa ? `<span style="color:var(--text-dim);font-size:.82rem;margin-left:8px">${escHtml(w.ipa)}</span>` : ''}
                    <span class="word-vi">— ${escHtml(w.vi)}</span>
                </div>
                <div class="word-meta">
                    <span class="word-cat ${catClass(w.cat)}">${catLabel(w.cat)}</span>
                    <div class="word-actions">
                        <button class="btn-edit" onclick="window._vocab.edit('${w.id}')" title="Sửa">✏️</button>
                        <button class="btn-delete" onclick="window._vocab.del('${w.id}')" title="Xóa">🗑️</button>
                    </div>
                </div>
            </div>
            ${w.example ? `<div class="word-example">${escHtml(w.example)}${w.exampleVi ? `<br><span style="color:var(--green);font-style:normal">→ ${escHtml(w.exampleVi)}</span>` : ''}</div>` : ''}
            <div class="word-date">Thêm: ${w.date ? new Date(w.date).toLocaleDateString('vi-VN') : '—'}</div>
            <div class="edit-inline ${isEditing ? 'open' : ''}" id="edit-${w.id}">
                <div class="form-row">
                    <div class="form-group"><label>Từ EN</label><input type="text" class="ed-en" value="${escHtml(w.en)}"></div>
                    <div class="form-group"><label>Nghĩa VN</label><input type="text" class="ed-vi" value="${escHtml(w.vi)}"></div>
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Loại</label>
                        <select class="ed-cat">
                            ${['noun','verb','adj','adv','phrase','tech','other'].map(c => `<option value="${c}" ${w.cat===c?'selected':''}>${catLabel(c)}</option>`).join('')}
                        </select>
                    </div>
                    <div class="form-group"><label>IPA</label><input type="text" class="ed-ipa" value="${escHtml(w.ipa || '')}"></div>
                </div>
                <div class="form-row full"><div class="form-group"><label>Ví dụ (EN)</label><input type="text" class="ed-example" value="${escHtml(w.example || '')}"></div></div>
                <div class="form-row full"><div class="form-group"><label>Ví dụ (VI)</label><input type="text" class="ed-example-vi" value="${escHtml(w.exampleVi || '')}"></div></div>
                <div class="form-actions">
                    <button class="btn btn-primary btn-sm" onclick="window._vocab.saveEdit('${w.id}')">Lưu</button>
                    <button class="btn btn-ghost btn-sm" onclick="window._vocab.cancelEdit()">Hủy</button>
                </div>
            </div>
        </div>`;
    }

    function render() {
        const query = searchBox.value.trim().toLowerCase();
        const cat = filterCat.value;

        let filtered = words.filter(w => {
            if (cat !== 'all' && w.cat !== cat) return false;
            if (query) {
                return w.en.toLowerCase().includes(query) ||
                       w.vi.toLowerCase().includes(query) ||
                       (w.example || '').toLowerCase().includes(query);
            }
            return true;
        });

        // Sort newest first
        filtered.sort((a, b) => new Date(b.date) - new Date(a.date));

        if (filtered.length === 0) {
            wordListEl.innerHTML = `
                <div class="empty-state">
                    <div class="icon">📚</div>
                    <h3>${query || cat !== 'all' ? 'Không tìm thấy' : 'Chưa có từ vựng nào'}</h3>
                    <p>${query || cat !== 'all' ? 'Thử tìm kiếm khác hoặc bỏ filter.' : 'Bấm "+ Thêm từ mới" hoặc Load file để bắt đầu.'}</p>
                </div>`;
        } else {
            wordListEl.innerHTML = filtered.map(renderWord).join('');
        }
        updateStats();
    }

    // ═══ ADD ═══
    function addWord() {
        const en = $('#inp-en').value.trim();
        const vi = $('#inp-vi').value.trim();
        if (!en) { toast('Cần điền Từ tiếng Anh!', 'error'); return; }

        words.push({
            id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
            en, vi,
            cat: $('#inp-cat').value,
            ipa: $('#inp-ipa').value.trim(),
            example: $('#inp-example').value.trim(),
            exampleVi: $('#inp-example-vi').value.trim(),
            date: new Date().toISOString()
        });

        saveToLocal();
        render();
        clearForm();
        toast(`Đã thêm "${en}"`);
        addForm.classList.remove('open');
    }

    function clearForm() {
        $('#inp-en').value = '';
        $('#inp-vi').value = '';
        $('#inp-cat').value = 'other';
        $('#inp-ipa').value = '';
        $('#inp-example').value = '';
        $('#inp-example-vi').value = '';
        hideLookupStatus();
    }

    // ═══ EDIT ═══
    function editWord(id) {
        editingId = editingId === id ? null : id;
        render();
    }
    function cancelEdit() {
        editingId = null;
        render();
    }
    function saveEdit(id) {
        const card = document.querySelector(`.word-card[data-id="${id}"]`);
        if (!card) return;
        const w = words.find(w => w.id === id);
        if (!w) return;

        const en = card.querySelector('.ed-en').value.trim();
        const vi = card.querySelector('.ed-vi').value.trim();
        if (!en) { toast('Cần điền Từ EN!', 'error'); return; }

        w.en = en;
        w.vi = vi;
        w.cat = card.querySelector('.ed-cat').value;
        w.ipa = card.querySelector('.ed-ipa').value.trim();
        w.example = card.querySelector('.ed-example').value.trim();
        w.exampleVi = card.querySelector('.ed-example-vi').value.trim();

        editingId = null;
        saveToLocal();
        render();
        toast(`Đã sửa "${en}"`);
    }

    // ═══ DELETE ═══
    function deleteWord(id) {
        const w = words.find(w => w.id === id);
        if (!w) return;
        deleteId = id;
        modalWord.textContent = w.en;
        modalDelete.classList.add('open');
    }
    function confirmDelete() {
        if (!deleteId) return;
        const w = words.find(w => w.id === deleteId);
        words = words.filter(w => w.id !== deleteId);
        deleteId = null;
        modalDelete.classList.remove('open');
        saveToLocal();
        render();
        toast(w ? `Đã xóa "${w.en}"` : 'Đã xóa', 'info');
    }

    // ═══ SAVE FILE ═══
    async function saveFile() {
        // Nếu form đang có dữ liệu → tự thêm từ trước khi save
        const formEn = $('#inp-en').value.trim();
        if (formEn) addWord();
        if (words.length === 0) { toast('Không có từ nào để lưu! Hãy thêm từ trước.', 'error'); return; }

        try {
            // File System Access API — chọn nơi lưu (lần đầu), sau đó auto-save
            if (window.showSaveFilePicker) {
                if (!fileHandle) {
                    fileHandle = await window.showSaveFilePicker({
                        suggestedName: 'my-vocabulary.txt',
                        types: [{ description: 'Text file', accept: { 'text/plain': ['.txt'] } }]
                    });
                }
                const writable = await fileHandle.createWritable();
                await writable.write(JSON.stringify(words, null, 2));
                await writable.close();
                updateFileStatus();
                toast(`Đã lưu ${words.length} từ vào ${fileHandle.name}!`);
            } else {
                // Fallback: download file (Firefox/Safari)
                const blob = new Blob([JSON.stringify(words, null, 2)], { type: 'text/plain;charset=utf-8' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = 'my-vocabulary.txt';
                a.click();
                URL.revokeObjectURL(a.href);
                toast(`Đã tải ${words.length} từ ra file!`);
            }
        } catch(e) {
            if (e.name !== 'AbortError') toast('Lỗi lưu file: ' + e.message, 'error');
        }
    }

    // ═══ LOAD FILE ═══
    async function loadFile() {
        try {
            if (window.showOpenFilePicker) {
                const [handle] = await window.showOpenFilePicker({
                    types: [{ description: 'Text file', accept: { 'text/plain': ['.txt'] } }]
                });
                fileHandle = handle; // giữ handle để Save ghi lại cùng file
                const file = await handle.getFile();
                const text = await file.text();
                parseAndLoad(text);
                updateFileStatus();
            } else {
                fileInput.click();
            }
        } catch(e) {
            if (e.name !== 'AbortError') toast('Lỗi đọc file: ' + e.message, 'error');
        }
    }

    function parseAndLoad(text) {
        try {
            const trimmed = (text || '').trim();
            // File trống hoặc rỗng → mảng rỗng
            const data = (!trimmed || trimmed === '') ? [] : JSON.parse(trimmed);
            if (!Array.isArray(data)) throw new Error('not array');
            // Replace toàn bộ (không merge) — file là nguồn chính
            words = data.map(w => ({
                id: w.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                en: w.en || '',
                vi: w.vi || '',
                cat: w.cat || 'other',
                ipa: w.ipa || '',
                example: w.example || '',
                exampleVi: w.exampleVi || '',
                date: w.date || new Date().toISOString()
            }));
            saveToLocal();
            render();
            toast(`Đã load ${words.length} từ từ file!`);
        } catch(err) {
            toast('File không đúng format!', 'error');
        }
    }

    // Fallback cho Firefox/Safari
    fileInput.addEventListener('change', function() {
        const file = this.files[0];
        if (!file) return;
        file.text().then(parseAndLoad);
        this.value = '';
    });

    // ═══ EVENTS ═══
    addToggle.addEventListener('click', () => {
        addForm.classList.toggle('open');
        if (addForm.classList.contains('open')) $('#inp-en').focus();
    });
    btnCancel.addEventListener('click', () => { addForm.classList.remove('open'); clearForm(); hideLookupStatus(); });
    btnAdd.addEventListener('click', addWord);
    btnLookup.addEventListener('click', lookupWord);
    btnSave.addEventListener('click', saveFile);
    btnLoad.addEventListener('click', loadFile);

    // Auto-lookup khi Tab ra khỏi ô English (nếu IPA trống)
    $('#inp-en').addEventListener('blur', function() {
        const word = this.value.trim();
        if (word && !$('#inp-ipa').value) lookupWord();
    });
    modalCancel.addEventListener('click', () => { modalDelete.classList.remove('open'); deleteId = null; });
    modalConfirm.addEventListener('click', confirmDelete);
    modalDelete.addEventListener('click', e => { if (e.target === modalDelete) { modalDelete.classList.remove('open'); deleteId = null; } });
    searchBox.addEventListener('input', render);
    filterCat.addEventListener('change', render);

    // Enter to add
    document.querySelectorAll('#add-form input').forEach(inp => {
        inp.addEventListener('keydown', e => { if (e.key === 'Enter') addWord(); });
    });

    // Hamburger
    const hamburger = document.querySelector('.nav-hamburger');
    const navLinks = document.querySelector('.nav-links');
    if (hamburger) {
        hamburger.addEventListener('click', () => {
            hamburger.classList.toggle('active');
            navLinks.style.display = navLinks.style.display === 'flex' ? 'none' : 'flex';
        });
    }

    // ═══ EXPOSE ═══
    window._vocab = { edit: editWord, del: deleteWord, saveEdit, cancelEdit };

    // ═══ INIT ═══
    loadFromLocal();
    render();
    updateFileStatus();
})();
</script>
</body>
</html>
